<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" style="background-color: #ffffff;">
  <!-- Background circle (optional, for icon shape) -->
  <defs>
    <filter id="displacement" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" />
    </filter>
  </defs>

  <!-- Bowl Body - Messy Lines -->
  <path d="M 100 220 
           Q 100 450 256 450 
           Q 412 450 412 220 
           Z" 
        fill="none" 
        stroke="#1b1b2f" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#displacement)" />
  
  <!-- Bowl Top Rim - Messy -->
  <ellipse cx="256" cy="220" rx="156" ry="35" 
           fill="#fef6e4" 
           stroke="#1b1b2f" 
           stroke-width="18"
           filter="url(#displacement)" 
           transform="rotate(-2 256 220)"/>

  <!-- Soup Liquid -->
  <ellipse cx="256" cy="225" rx="130" ry="25" 
           fill="#00aedf" 
           opacity="0.2"
           filter="url(#displacement)" />

  <!-- Letter L - Breaking Out Left -->
  <path d="M 160 140 
           L 150 300 
           L 220 310" 
        fill="none" 
        stroke="#ec008b" 
        stroke-width="35" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#displacement)"
        transform="rotate(-15 160 300)"/>

  <!-- Letter S - Breaking Out Right -->
  <path d="M 360 130 
           C 300 130, 300 200, 350 220 
           C 400 240, 400 310, 340 310" 
        fill="none" 
        stroke="#19b091" 
        stroke-width="35" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#displacement)"
        transform="rotate(10 350 220)"/>

  <!-- Extra splatters/doodles -->
  <circle cx="420" cy="180" r="8" fill="#ec008b" filter="url(#displacement)" />
  <circle cx="90" cy="250" r="6" fill="#00aedf" filter="url(#displacement)" />
  <path d="M 440 350 L 460 380" stroke="#1b1b2f" stroke-width="8" stroke-linecap="round" filter="url(#displacement)" />

</svg>
